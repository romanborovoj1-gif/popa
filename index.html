<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON RUSH — 3D Racing</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;font-family:Inter,Arial,sans-serif;color:#fff;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .panel{background:linear-gradient(135deg,rgba(9,17,30,.82),rgba(13,27,44,.55));border:1px solid rgba(130,210,255,.22);backdrop-filter:blur(12px);border-radius:14px;padding:11px 15px;box-shadow:0 8px 30px #0005}
  .brand{font-size:12px;letter-spacing:3px;color:#64dfff;font-weight:900}
  .speed{font-size:30px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
  .small{font-size:10px;letter-spacing:1.5px;color:#9bb3c8}
  #lap{font-size:18px;font-weight:800}
  #message{position:absolute;top:23%;width:100%;text-align:center;font-weight:900;font-size:clamp(20px,5vw,42px);letter-spacing:2px;text-shadow:0 4px 18px #000;opacity:0;transition:opacity .25s}
  #bottom{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px}
  .controls{display:flex;gap:12px;pointer-events:auto}
  .btn{width:68px;height:68px;border-radius:19px;border:1px solid rgba(180,230,255,.35);background:linear-gradient(145deg,rgba(29,57,80,.8),rgba(9,19,31,.88));color:#fff;font-size:26px;font-weight:800;display:grid;place-items:center;box-shadow:0 7px 20px #0006;touch-action:none;outline:none}
  .btn:active,.btn.pressed{background:linear-gradient(145deg,#13a9d2,#126184);border-color:#8beaff;transform:scale(.96)}
  .pedals{display:flex;gap:10px;pointer-events:auto}
  .pedals .btn{width:72px;height:82px;font-size:12px;letter-spacing:1px}
  #gas{background:linear-gradient(145deg,rgba(11,126,91,.9),rgba(5,47,43,.95))}
  #brake{background:linear-gradient(145deg,rgba(154,54,52,.9),rgba(57,20,28,.95))}
  #hint{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);font-size:11px;color:#b7cad8;white-space:nowrap;text-shadow:0 2px 5px #000}
  #start{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(12,31,49,.45),rgba(2,6,12,.9));display:flex;align-items:center;justify-content:center;z-index:5}
  .start-card{text-align:center;padding:30px 26px;width:min(88vw,420px);border-radius:24px;background:rgba(7,17,29,.82);border:1px solid rgba(102,218,255,.3);box-shadow:0 20px 80px #000a;backdrop-filter:blur(16px)}
  .start-card h1{font-size:clamp(32px,9vw,54px);margin:0;letter-spacing:2px;font-style:italic}
  .start-card h1 span{color:#39d7ff}
  .start-card p{color:#a8bdce;font-size:13px;line-height:1.6;margin:12px 0 22px}
  #play{border:0;border-radius:12px;padding:15px 35px;background:linear-gradient(90deg,#08a8d4,#18d6a1);color:#00131b;font-weight:900;font-size:15px;letter-spacing:2px}
  @media(max-width:600px){.top{top:12px;left:12px;right:12px}.panel{padding:9px 11px}.speed{font-size:25px}#bottom{padding:0 12px;bottom:14px}.btn{width:62px;height:62px}.pedals .btn{width:66px;height:76px}#hint{bottom:100px}}
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="panel"><div class="brand">NEON RUSH</div><div class="small">ARCADE RACING</div></div>
    <div class="panel" style="text-align:right"><div class="small">СКОРОСТЬ</div><div class="speed"><span id="speed">0</span> <span style="font-size:12px;color:#9bb3c8">КМ/Ч</span></div></div>
    <div class="panel" style="text-align:right"><div class="small">КРУГ</div><div id="lap">01 / 03</div></div>
  </div>
  <div id="message"></div>
  <div id="hint">WASD / стрелки или экранные кнопки</div>
  <div id="bottom">
    <div class="controls">
      <button class="btn" id="left" aria-label="Влево">◀</button>
      <button class="btn" id="right" aria-label="Вправо">▶</button>
    </div>
    <div class="pedals">
      <button class="btn" id="brake">ТОРМОЗ</button>
      <button class="btn" id="gas">ГАЗ</button>
    </div>
  </div>
</div>
<div id="start">
  <div class="start-card">
    <div class="brand">3D STREET CIRCUIT</div>
    <h1>NEON <span>RUSH</span></h1>
    <p>Ночная трасса, динамичная камера и физика автомобиля.<br>Управление: кнопки на экране или WASD / стрелки.</p>
    <button id="play">НАЧАТЬ ГОНКУ</button>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07111e);
scene.fog = new THREE.FogExp2(0x07111e, 0.0065);
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 900);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9fcfff,0x18202a,1.5));
const moon = new THREE.DirectionalLight(0xd5eaff,2.3);
moon.position.set(-70,100,30); moon.castShadow=true; moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-100;moon.shadow.camera.right=100;moon.shadow.camera.top=100;moon.shadow.camera.bottom=-100;
scene.add(moon);

const mat=(color,roughness=.6,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const asphalt=mat(0x252d37,.94), concrete=mat(0x66717b), white=mat(0xe5f2fa), dark=mat(0x111923), glass= new THREE.MeshStandardMaterial({color:0x18394c,metalness:.65,roughness:.18});
const glowMat=new THREE.MeshStandardMaterial({color:0x23d9ff,emissive:0x087aab,emissiveIntensity:2});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),mat(0x101c24,1));ground.rotation.x=-Math.PI/2;ground.position.y=-.18;ground.receiveShadow=true;scene.add(ground);

const rx=72, rz=43, roadW=17;
function ovalPoint(t,offset=0){return new THREE.Vector3((rx+offset)*Math.cos(t),0,(rz+offset)*Math.sin(t));}
function makeRoad(){
 const verts=[],inds=[],uv=[];
 const segments=240;
 for(let i=0;i<=segments;i++){
  const t=i/segments*Math.PI*2,p1=ovalPoint(t,-roadW/2),p2=ovalPoint(t,roadW/2);
  verts.push(p1.x,.015,p1.z,p2.x,.015,p2.z);uv.push(i/segments*12,0,i/segments*12,1);
  if(i<segments){let a=i*2;inds.push(a,a+1,a+2,a+1,a+3,a+2);}
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(inds);g.computeVertexNormals();
 const road=new THREE.Mesh(g,asphalt);road.receiveShadow=true;scene.add(road);
}
makeRoad();
function addLine(offset,color,width=.32){
 const pts=[];for(let i=0;i<=240;i++)pts.push(ovalPoint(i/240*Math.PI*2,offset).setY(.07));
 const curve=new THREE.CatmullRomCurve3(pts,true);
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,480,width,5,true),mat(color,.7,.1));scene.add(mesh);
}
addLine(-roadW/2+.6,0xe8f2f5,.13);addLine(roadW/2-.6,0xe8f2f5,.13);
addLine(-roadW/2+1.35,0x21c8ed,.09);addLine(roadW/2-1.35,0x21c8ed,.09);
for(let i=0;i<100;i++){
 const t=i/100*Math.PI*2,p=ovalPoint(t,0);
 const dash=new THREE.Mesh(new THREE.BoxGeometry(2.2,.035,.18),white);
 dash.position.set(p.x,.09,p.z);dash.rotation.y=-t;scene.add(dash);
}
const island=new THREE.Mesh(new THREE.CylinderGeometry(29,29,.22,96),mat(0x18362c));island.scale.set(1,1,1);island.position.y=-.04;scene.add(island);
const outer=new THREE.Mesh(new THREE.CylinderGeometry(90,90,.18,128),mat(0x172a28));outer.position.y=-.13;scene.add(outer);
function addBarrier(t,offset){
 const p=ovalPoint(t,offset),b=new THREE.Mesh(new THREE.BoxGeometry(5,1.1,.8),mat(0x64717c,.45,.25));
 b.position.set(p.x,.55,p.z);b.rotation.y=-t;b.castShadow=true;b.receiveShadow=true;scene.add(b);
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(5.02,.18,.82),glowMat);stripe.position.copy(b.position);stripe.position.y=.88;stripe.rotation.y=-t;scene.add(stripe);
}
for(let i=0;i<80;i++){let t=i/80*Math.PI*2;addBarrier(t,roadW/2+2.7);addBarrier(t,-roadW/2-2.7);}
const startLine=new THREE.Mesh(new THREE.BoxGeometry(1,.04,roadW),white);startLine.position.set(rx,.12,0);scene.add(startLine);
for(let z=-7;z<8;z+=2){const tile=new THREE.Mesh(new THREE.BoxGeometry(1.05,.05,1.9),mat((z+7)%4===0?0x101820:0xffffff));tile.position.set(rx+.02,.15,z);scene.add(tile);}

for(let i=0;i<85;i++){
 const a=Math.random()*Math.PI*2,r=110+Math.random()*95,x=Math.cos(a)*r,z=Math.sin(a)*r;
 const h=8+Math.random()*35,w=5+Math.random()*12;
 const building=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat([0x172536,0x1d2d40,0x263343][i%3]));
 building.position.set(x,h/2-0.1,z);scene.add(building);
 for(let k=0;k<Math.floor(h/3);k++){
  const win=new THREE.Mesh(new THREE.BoxGeometry(.22,.5,.04),new THREE.MeshBasicMaterial({color:Math.random()>.5?0x38bce5:0xffc86b}));
  win.position.set(x-w/2+.8+(Math.random()*(w-1.6)),1+k*2.5,z+w/2+.025);scene.add(win);
 }
}
for(let i=0;i<32;i++){
 const t=i/32*Math.PI*2,p=ovalPoint(t,roadW/2+7);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,7,8),dark);pole.position.set(p.x,3.5,p.z);scene.add(pole);
 const arm=new THREE.Mesh(new THREE.BoxGeometry(2.5,.12,.12),dark);arm.position.set(p.x+(Math.cos(t)*1.1),6.8,p.z+Math.sin(t)*1.1);scene.add(arm);
 const bulb=new THREE.PointLight(0x5edcff,16,25,2);bulb.position.set(p.x,6.5,p.z);scene.add(bulb);
 const orb=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),glowMat);orb.position.copy(bulb.position);scene.add(orb);
}

const car=new THREE.Group();scene.add(car);
const bodyMat= new THREE.MeshStandardMaterial({color:0xe32642,metalness:.72,roughness:.24});
const body=new THREE.Mesh(new THREE.BoxGeometry(2.15,.62,4.2),bodyMat);body.position.y=.85;body.castShadow=true;car.add(body);
const hood=new THREE.Mesh(new THREE.BoxGeometry(2.05,.22,1.15),bodyMat);hood.position.set(0,1.18,-1.35);car.add(hood);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.62,.82,1.85),glass);cabin.position.set(0,1.48,.25);cabin.castShadow=true;car.add(cabin);
const roof=new THREE.Mesh(new THREE.BoxGeometry(1.55,.12,1.65),mat(0x101c28,.3,.6));roof.position.set(0,1.91,.28);car.add(roof);
const spoiler=new THREE.Mesh(new THREE.BoxGeometry(2.25,.12,.38),dark);spoiler.position.set(0,1.65,1.92);car.add(spoiler);
const wheelGeo=new THREE.CylinderGeometry(.43,.43,.32,20);wheelGeo.rotateZ(Math.PI/2);
const wheels=[];
for(const x of [-1.08,1.08])for(const z of [-1.35,1.35]){
 const w=new THREE.Mesh(wheelGeo,mat(0x080b10,.9));w.position.set(x,.52,z);w.castShadow=true;car.add(w);wheels.push(w);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.34,16),mat(0x8da1ad,.25,.8));hub.rotation.z=Math.PI/2;hub.position.copy(w.position);car.add(hub);
}
for(const x of [-.72,.72]){
 const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.16,.08),new THREE.MeshBasicMaterial({color:0xb9f4ff}));head.position.set(x,.95,-2.12);car.add(head);
 const tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.16,.08),new THREE.MeshBasicMaterial({color:0xff183b}));tail.position.set(x,.95,2.12);car.add(tail);
}
const shadow=new THREE.Mesh(new THREE.CircleGeometry(2.1,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.04;car.add(shadow);

let pos=new THREE.Vector3(rx,0,-8),heading=0,speed=0,steer=0,started=false,lap=1,lastAngle=0,lapProgress=0;
car.position.copy(pos);
const input={left:false,right:false,gas:false,brake:false};
const bind=(id,key)=>{
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();input[key]=true;el.classList.add('pressed');};
 const up=e=>{e.preventDefault();input[key]=false;el.classList.remove('pressed');};
 el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
};
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','w'].includes(k))input.gas=true;if(['arrowdown','s'].includes(k))input.brake=true;if(['arrowleft','a'].includes(k))input.left=true;if(['arrowright','d'].includes(k))input.right=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['arrowup','w'].includes(k))input.gas=false;if(['arrowdown','s'].includes(k))input.brake=false;if(['arrowleft','a'].includes(k))input.left=false;if(['arrowright','d'].includes(k))input.right=false;});
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';started=true;showMessage('ПОЕХАЛИ!',1100);};
function showMessage(t,ms=900){const m=document.getElementById('message');m.textContent=t;m.style.opacity=1;setTimeout(()=>m.style.opacity=0,ms);}
const clock=new THREE.Clock();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function update(dt){
 if(!started){camera.position.lerp(new THREE.Vector3(rx+12,10,-20),.02);camera.lookAt(rx,0,0);return;}
 const throttle=input.gas?1:0,brake=input.brake?1:0;
 const steerInput=(input.left?1:0)-(input.right?1:0);
 speed+=throttle*25*dt;
 speed-=brake*42*dt;
 speed-=speed*(Math.abs(speed)>.1?0.72:3.5)*dt;
 speed=clamp(speed,-12,68);
 const steerTarget=steerInput*0.62;
 steer+=(steerTarget-steer)*Math.min(1,dt*7);
 const grip=clamp(Math.abs(speed)/10,0,1);
 heading+=steer*grip*(speed>=0?1:-1)*dt*(.95+Math.abs(speed)*.012);
 const forward=new THREE.Vector3(-Math.sin(heading),0,-Math.cos(heading));
 const right=new THREE.Vector3(Math.cos(heading),0,-Math.sin(heading));
 pos.addScaledVector(forward,speed*dt);
 const radial=Math.sqrt((pos.x/rx)**2+(pos.z/rz)**2);
 const angle=Math.atan2(pos.z/rz,pos.x/rx);
 const trackDist=Math.abs(radial-1)*Math.min(rx,rz);
 if(trackDist>roadW/2-1.3){speed*=Math.pow(.82,dt*60);pos.addScaledVector(right,-steerInput*speed*dt*.22);}
 if(trackDist>roadW/2+4){speed*=-.24;pos.addScaledVector(forward,-1.1);showMessage('СТОЛКНОВЕНИЕ',450);}
 if(Math.abs(pos.x)>105||Math.abs(pos.z)>78){speed*=-.25;pos.x=clamp(pos.x,-104,104);pos.z=clamp(pos.z,-77,77);}
 car.position.set(pos.x,.04+Math.sin(clock.elapsedTime*14)*Math.min(Math.abs(speed)/300,.035),pos.z);
 car.rotation.y=heading;
 wheels.forEach(w=>w.rotation.x-=speed*dt*1.7);
 let a=Math.atan2(pos.z/rz,pos.x/rx);let da=a-lastAngle;
 if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;
 lapProgress+=da;lastAngle=a;
 if(lapProgress>Math.PI*2){lapProgress=0;lap++;document.getElementById('lap').textContent=String(Math.min(lap,3)).padStart(2,'0')+' / 03';if(lap>3){showMessage('ФИНИШ!');started=false;}}
 const camOffset=new THREE.Vector3(0,5.2,10.8).applyAxisAngle(new THREE.Vector3(0,1,0),heading);
 const desired=car.position.clone().add(camOffset);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 const look=car.position.clone().addScaledVector(forward,5);look.y+=1.1;camera.lookAt(look);
 document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera);}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
